name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}  # For remotes access
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node 24 to suppress deprecation warning
    steps:
      - uses: actions/checkout@v4  # Updated to v4 (Node 24)

      - uses: r-lib/actions/setup-pandoc@v2  # v2 is still current, compatible

      - uses: r-lib/actions/setup-r@v2  # v2 is current, compatible
        with:
          r-version: '4.4'  # Match your R version
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Check
        id: check
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error", check_dir = "check")
        shell: Rscript {0}

      - name: Report check errors
        if: failure()
        run: |
          LOG=$(find . -name 00check.log 2>/dev/null | head -1)
          if [ -z "$LOG" ]; then
            echo "::error title=R CMD check::package check log not found"
            exit 0
          fi
          echo "----- 00check.log (tail) -----"
          tail -n 120 "$LOG"
          MSG=$(grep -m1 -B2 -A25 -E "ERROR|Error" "$LOG" | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-900)
          echo "::error title=R CMD check error::${MSG}"
